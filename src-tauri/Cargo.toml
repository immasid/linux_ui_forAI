[package]
name = "ai-ui"
version = "0.0.0"
description = "ai-ui desktop spike"
edition = "2021"

[lib]
name = "ai_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
